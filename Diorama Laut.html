<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Terumbu Karang Voxel 3D</title>
    <style>
        /* Latar belakang dibuat transparan */
        body { 
            margin: 0; 
            overflow: hidden; 
            background-color: transparent; 
        }
        #canvas-container { 
            width: 100vw; 
            height: 100vh; 
        }
    </style>
</head>
<body>

    <div id="canvas-container"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <script>
        // 1. SETUP SCENE
        const scene = new THREE.Scene();
        // Latar belakang dan fog dihapus agar tembus pandang (transparan)

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(35, 30, 35);

        // Mengaktifkan parameter 'alpha' agar canvas tembus pandang
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setClearColor(0x000000, 0); // Setup transparansi
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        // 2. KONTROL KAMERA (FIXED & AUTO ROTATE)
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        
        // Menonaktifkan interaksi user (Zoom, Geser, Putar Manual)
        controls.enableZoom = false;   
        controls.enablePan = false;    
        controls.enableRotate = false; 

        // Mengatur putaran otomatis (Kecepatan sedang + 5% ekstra)
        controls.autoRotate = true;
        controls.autoRotateSpeed = 2.1; 
        controls.target.set(0, 5, 0);

        // 3. PENCAHAYAAN
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);
        const sunLight = new THREE.DirectionalLight(0xffffff, 0.9);
        sunLight.position.set(20, 40, 20);
        sunLight.castShadow = true;
        sunLight.shadow.mapSize.width = 2048;
        sunLight.shadow.mapSize.height = 2048;
        sunLight.shadow.camera.near = 0.5;
        sunLight.shadow.camera.far = 100;
        sunLight.shadow.camera.left = -25;
        sunLight.shadow.camera.right = 25;
        sunLight.shadow.camera.top = 25;
        sunLight.shadow.camera.bottom = -25;
        scene.add(sunLight);

        // 4. SETUP INSTANCED MESH
        const voxelGeo = new THREE.BoxGeometry(1, 1, 1);
        const maxInstances = 40000;
        
        const matColors = {
            sand: 0xe3d3ab,
            rock: 0x636e72,
            brainCoral: 0xe84393,    
            tableCoral: 0x0984e3,    
            branchCoral1: 0x00b894,  
            branchCoral2: 0xfdcB6E   
        };

        const instancedMeshes = {};
        const counters = {};
        const dummy = new THREE.Object3D();

        for (const [key, color] of Object.entries(matColors)) {
            const material = new THREE.MeshLambertMaterial({ color: color });
            const mesh = new THREE.InstancedMesh(voxelGeo, material, maxInstances);
            mesh.castShadow = true;
            mesh.receiveShadow = true;
            scene.add(mesh);
            instancedMeshes[key] = mesh;
            counters[key] = 0;
        }

        function addVoxel(x, y, z, type) {
            const index = counters[type];
            if (index >= maxInstances) return; 
            dummy.position.set(x, y, z);
            dummy.updateMatrix();
            instancedMeshes[type].setMatrixAt(index, dummy.matrix);
            counters[type]++;
        }

        // 5. ALGORITMA BENTUK TERUMBU KARANG
        
        function buildBrainCoral(cx, cy, cz, type) {
            const radius = 2 + Math.floor(Math.random() * 3); 
            for(let x = -radius; x <= radius; x++) {
                for(let y = 0; y <= radius; y++) {
                    for(let z = -radius; z <= radius; z++) {
                        if(x*x + y*y + z*z <= radius*radius) {
                            if(Math.random() > 0.1) addVoxel(cx+x, cy+y, cz+z, type);
                        }
                    }
                }
            }
        }

        function buildTableCoral(cx, cy, cz, type) {
            const height = 3 + Math.floor(Math.random() * 4);
            const radius = 4 + Math.floor(Math.random() * 4);
            
            for(let y = 0; y < height; y++) {
                addVoxel(cx, cy+y, cz, type);
                addVoxel(cx+1, cy+y, cz, type);
                addVoxel(cx, cy+y, cz+1, type);
                addVoxel(cx+1, cy+y, cz+1, type);
            }
            
            const topY = cy + height;
            for(let x = -radius; x <= radius; x++) {
                for(let z = -radius; z <= radius; z++) {
                    if(x*x + z*z <= radius*radius) {
                        if(Math.random() > 0.2) addVoxel(cx+x, topY, cz+z, type);
                        if(Math.random() > 0.7) addVoxel(cx+x, topY-1, cz+z, type);
                    }
                }
            }
        }

        function buildBranchingCoral(cx, cy, cz, type) {
            const numBranches = 5 + Math.floor(Math.random() * 5); 
            
            for(let i = 0; i < numBranches; i++) {
                let bx = cx, by = cy, bz = cz;
                let dirX = (Math.random() - 0.5) * 1.5; 
                let dirZ = (Math.random() - 0.5) * 1.5;
                const length = 5 + Math.floor(Math.random() * 6);
                
                for(let l = 0; l < length; l++) {
                    addVoxel(Math.round(bx), Math.round(by), Math.round(bz), type);
                    if(l < length / 2) {
                        addVoxel(Math.round(bx)+1, Math.round(by), Math.round(bz), type);
                        addVoxel(Math.round(bx), Math.round(by), Math.round(bz)+1, type);
                    }
                    bx += dirX;
                    by += 1; 
                    bz += dirZ;
                }
            }
        }

        // 6. GENERATE LINGKUNGAN LAUT
        const areaSize = 30; 
        
        for (let x = -areaSize/2; x < areaSize/2; x++) {
            for (let z = -areaSize/2; z < areaSize/2; z++) {
                let groundHeight = Math.floor(Math.sin(x/4) * 1.5 + Math.cos(z/4) * 1.5);
                
                for (let y = -4; y <= groundHeight; y++) {
                     addVoxel(x, y, z, 'sand');
                }

                if (Math.random() > 0.95) {
                    const rockHeight = 1 + Math.floor(Math.random() * 3);
                    for(let ry = 1; ry <= rockHeight; ry++) addVoxel(x, groundHeight + ry, z, 'rock');
                    
                    if(Math.random() > 0.4) {
                        const rand = Math.random();
                        const cy = groundHeight + rockHeight + 1;
                        if(rand < 0.3) buildBrainCoral(x, cy, z, 'brainCoral');
                        else if(rand < 0.6) buildTableCoral(x, cy, z, 'tableCoral');
                        else if(rand < 0.8) buildBranchingCoral(x, cy, z, 'branchCoral1');
                        else buildBranchingCoral(x, cy, z, 'branchCoral2');
                    }
                }
            }
        }

        for (const key in instancedMeshes) {
            instancedMeshes[key].instanceMatrix.needsUpdate = true;
        }

        // 7. EFEK KUBUS AIR LAUT
        const waterGeo = new THREE.BoxGeometry(areaSize, 20, areaSize);
        const waterMat = new THREE.MeshLambertMaterial({
            color: 0x0984e3,
            transparent: true,
            opacity: 0.25,
            side: THREE.DoubleSide
        });
        const water = new THREE.Mesh(waterGeo, waterMat);
        water.position.set(-0.5, 6, -0.5);
        scene.add(water);

        // 8. RESPONSIVE WINDOW
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // 9. ANIMASI RENDER LOOP
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
